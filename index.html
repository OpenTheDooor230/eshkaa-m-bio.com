<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expyy</title>
<link rel="icon" type="image/jpeg" href="images/sitepfp.jpg">
<link rel="apple-touch-icon" href="images/sitepfp.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:linear-gradient(160deg,#8fb4e3,#cfe0f5 45%,#9db8d6) center/cover fixed;font-family:"Poppins","Segoe UI",system-ui,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1390px;height:720px;transform-origin:0 0}
.glass{position:absolute;background:rgba(255,255,255,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.5);box-shadow:0 8px 30px rgba(0,0,0,.12)}
#main{left:190px;top:80px;width:1010px;height:560px;border-radius:40px}
#side{left:60px;top:80px;width:80px;height:560px;border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px 0}
#side a,#side .s{width:46px;height:46px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;text-decoration:none;transition:.2s}
#side a:hover{transform:scale(1.12);background:#333}
#side .s{background:none;color:#111;margin-bottom:6px}
#side svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#clock{position:absolute;left:250px;top:112px;font-size:44px;font-weight:600;letter-spacing:3px;color:#111;font-family:"Poppins",sans-serif;line-height:1}
#date{position:absolute;left:252px;top:162px;font-size:15px;color:#222;letter-spacing:1px}
#cal{position:absolute;left:235px;top:235px;width:195px;height:190px;background:#1c1c1e;border-radius:22px;color:#fff;padding:14px 16px;text-align:center}
#cal h3{font-size:15px;font-weight:600;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #fff}
#cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px 0;font-size:11px}
#cal .h{color:#e8b34a;font-size:9px}
#cal .t{font-weight:800}
#cal i{position:absolute;bottom:8px;left:50%;width:50px;height:3px;margin-left:-25px;background:#fff;border-radius:3px}
#char{position:absolute;max-width:none;z-index:3;pointer-events:none}
#jp{position:absolute;left:518px;top:175px;writing-mode:vertical-rl;font-size:13px;color:#111;letter-spacing:3px;z-index:4}
#logo{left:565px;top:0;position:absolute}
#logoWrap{position:absolute;left:864px;top:110px;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;z-index:4}
#pill{position:absolute;left:1000px;top:112px;width:140px;height:40px;border-radius:30px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:space-between;padding:0 5px 0 18px;font-weight:600;color:#111;z-index:4}
#pill img,#pill .av{width:30px;height:30px;border-radius:50%;background:#8a6ee0;object-fit:cover}
#hi{position:absolute;left:1000px;top:178px;font-size:19px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.25);z-index:4;white-space:nowrap}
.card{position:absolute;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.7);border:4px solid #fff;z-index:4}
.card img{width:100%;height:100%;object-fit:cover;display:block}
#c1{left:845px;top:230px;width:138px;height:190px}
#c2{left:995px;top:230px;width:138px;height:90px}
#c3{left:995px;top:330px;width:138px;height:90px;background:#f3c6d8}
#music{left:848px;top:462px;width:285px;height:62px;border-radius:20px;z-index:4;display:flex;align-items:center;gap:14px;padding:0 14px;color:#111;font-size:13px}
#music .cv{width:38px;height:38px;border-radius:10px;background:#111}
#music b{font-weight:600;display:block;margin-bottom:4px}
#jp{font-family:"Noto Sans JP",sans-serif}
#logoWrap svg{width:22px;height:22px}
#music{top:452px;height:72px;padding:0 16px;gap:14px}
#music .cv{width:42px;height:42px;border-radius:12px;background:#111 center/cover;position:relative;overflow:hidden;flex:none}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:9px;background:rgba(0,0,0,.35)}
.playing .eq{display:flex}
.eq i{width:4px;height:30%;background:#fff;border-radius:2px;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{to{height:100%}}
.mi{flex:1;min-width:0}
#music b{font-size:12px;font-weight:500;display:block;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:rgba(0,0,0,.2);border-radius:4px;cursor:pointer;overflow:hidden}
.bar u{display:block;height:100%;width:0;background:#111;border-radius:4px}
.ctl{display:flex;gap:16px;margin-top:7px;align-items:center}
.ctl button{background:none;border:0;color:#111;cursor:pointer;padding:0;display:grid;transition:.15s}
.ctl button:hover{transform:scale(1.25)}
.ctl button.on{color:#e0457b}
.ctl svg{width:15px;height:15px;fill:currentColor}
.ctl svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== анимации ===== */
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{50%{translate:0 -12px}}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,179,74,.7)}50%{box-shadow:0 0 0 6px rgba(232,179,74,0)}}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
#main{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards;overflow:hidden}
#main::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);animation:sheen 9s ease-in-out infinite 1.5s}
#side{animation:rise .8s .1s cubic-bezier(.2,.8,.2,1) backwards}
#side a{animation:rise .6s backwards}
#side a:nth-child(2){animation-delay:.35s}#side a:nth-child(3){animation-delay:.45s}#side a:nth-child(4){animation-delay:.55s}
#side a:nth-child(5){animation-delay:.65s}#side a:nth-child(6){animation-delay:.75s}#side a:nth-child(7){animation-delay:.85s}
#clock{animation:rise .8s .3s backwards}#date{animation:rise .8s .4s backwards}
#cal{animation:rise .8s .5s backwards;transition:.3s}#cal:hover{transform:translateY(-4px) scale(1.03)}
#cal .t{display:inline-block;border-radius:50%;animation:pulse 2s infinite;background:#e8b34a;color:#111;width:18px;height:18px;line-height:18px;margin:0 auto}
.colon{animation:blink 1s steps(1) infinite}
#char{transform:translate(var(--px,0px),var(--py,0px));transition:transform .4s ease-out;animation:fade 1.2s .4s backwards,float 6s 1.6s ease-in-out infinite}
#jp{animation:fade 1s .9s backwards}
#logoWrap{animation:rise .7s .6s backwards;transition:.4s}#logoWrap:hover{transform:rotate(180deg)}
#pill{animation:rise .7s .65s backwards;transition:.3s}#pill:hover{transform:scale(1.05)}
#hi{animation:rise .7s .75s backwards}
.card{transition:.35s cubic-bezier(.2,.8,.2,1)}
#c1{animation:rise .7s .8s backwards}#c2{animation:rise .7s .9s backwards}#c3{animation:rise .7s 1s backwards}
.card:hover{transform:scale(1.06) rotate(-1.5deg);z-index:6;box-shadow:0 12px 28px rgba(0,0,0,.25)}
#music{animation:rise .7s 1.1s backwards}

/* правая панель ссылок */
#side2{left:1250px;top:80px;width:80px;height:560px;border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px 0;animation:rise .8s .2s cubic-bezier(.2,.8,.2,1) backwards}
#side2 a{width:46px;height:46px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;text-decoration:none;transition:.2s;animation:rise .6s backwards}
#side2 a:nth-child(1){animation-delay:.5s}#side2 a:nth-child(2){animation-delay:.6s}#side2 a:nth-child(3){animation-delay:.7s}#side2 a:nth-child(4){animation-delay:.8s}#side2 a:nth-child(5){animation-delay:.9s}#side2 a:nth-child(6){animation-delay:1s}
#side2 a:hover{transform:scale(1.12);background:#333}
#side2 svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== крупнее ===== */
body{background:none}
#main,#side{height:520px}
#side,#side2{z-index:8}
#side a,#side2 a{position:relative}
#side a{width:58px;height:58px}#side svg{width:28px;height:28px}#side .s{width:50px;height:50px}
#clock{font-family:"Orbitron","Poppins",sans-serif;font-size:52px;letter-spacing:4px;top:106px}
#date{top:172px;font-size:17px}
#cal{scale:1.2;top:252px}
#c1{left:830px;top:225px;width:165px;height:225px}
#c2{left:1007px;top:225px;width:165px;height:106px}
#c3{left:1007px;top:344px;width:165px;height:106px}
#pill{left:1007px;top:106px;width:165px;height:46px;font-size:16px}
#pill img,#pill .av{width:36px;height:36px}
#hi{left:890px;top:172px;font-size:22px}
#logoWrap{left:840px;top:106px;width:48px;height:48px}
#music{left:830px;top:468px;width:342px;height:84px}
/* док внизу */
#side2{left:50%;top:630px;width:max-content;height:70px;flex-direction:row;padding:0 30px;gap:26px;border-radius:35px;translate:-50% 0}
#side2 a{width:54px;height:54px}#side2 svg{width:28px;height:28px}
/* подсказки */
[data-tip]::after{content:attr(data-tip);position:absolute;white-space:nowrap;padding:6px 13px;border-radius:12px;background:rgba(20,22,30,.88);color:#fff;font:500 13px Poppins,sans-serif;opacity:0;pointer-events:none;transition:.25s}
#side [data-tip]::after{left:calc(100% + 16px);top:50%;transform:translate(-6px,-50%)}
#side [data-tip]:hover::after{opacity:1;transform:translate(0,-50%)}
#side2 [data-tip]::after{bottom:calc(100% + 16px);left:50%;transform:translate(-50%,6px)}
#side2 [data-tip]:hover::after{opacity:1;transform:translate(-50%,0)}
/* атмосфера */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(15,25,60,.38))}

/* ===== телефон ===== */
@media (orientation: portrait) and (max-width: 700px) {
  #stage{width:390px;height:844px}
  #main{left:16px;top:64px;width:358px;height:690px;border-radius:34px}
  #side{left:30px;top:510px;width:330px;height:62px;border-radius:31px;display:flex;flex-direction:row;justify-content:center;gap:10px;padding:0 8px}
  #side .s{display:none}
  #side a{width:48px;height:48px}
  #side svg{width:24px;height:24px}
  #side [data-tip]::after{left:50%;top:auto;bottom:calc(100% + 8px);transform:translate(-50%,6px)}
  #side [data-tip]:hover::after{transform:translate(-50%,0)}
  #clock{left:36px;top:94px;font-size:38px;letter-spacing:2px}
  #date{left:38px;top:148px;font-size:14px}
  #cal{display:none}
  #jp{left:auto;right:28px;top:110px;font-size:12px}
  #logoWrap{left:38px;top:194px;width:44px;height:44px}
  #pill{left:206px;top:194px;width:146px;height:44px;font-size:14px}
  #pill img,#pill .av{width:34px;height:34px}
  #hi{left:160px;top:250px;font-size:16px}
  #c1{left:30px;top:290px;width:142px;height:190px}
  #c2{left:184px;top:290px;width:176px;height:88px}
  #c3{left:184px;top:390px;width:176px;height:90px}
  #music{left:30px;top:648px;width:330px;height:82px}
  #side2{left:50%;top:766px;width:358px;height:62px;gap:14px;padding:0 16px;border-radius:31px}
  #side2 a{width:48px;height:48px}
  #side2 svg{width:24px;height:24px}
  #side2 [data-tip]::after{bottom:calc(100% + 10px)}
  #char{z-index:3}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="stage">
  <div class="glass" id="side"></div>
  <div class="glass" id="side2"></div>
  <div class="glass" id="main"></div>

  <div id="clock">00:00</div>
  <div id="date"></div>
  <div id="cal"></div>

  <img id="char" alt="" onerror="this.style.display='none'">
  <div id="jp"></div>

  <div id="logoWrap"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M8 3h4a3.5 3.5 0 0 1 0 7H8zM12 3h4a3.5 3.5 0 0 1 0 7h-4zM8 10h4v7a0 0 0 0 1 0 0 3.5 3.5 0 1 1-4-3.4A3.5 3.5 0 0 1 8 10zM12 10a3.5 3.5 0 1 1 0 7z" stroke-linejoin="round"/></svg></div>
  <div id="pill"><span id="pname"></span><img id="pav" alt="" onerror="this.outerHTML='<div class=av></div>'"></div>
  <div id="hi"></div>
  <div class="card" id="c1"></div>
  <div class="card" id="c2"></div>
  <div class="card" id="c3"></div>
  <div class="glass" id="music"><div class="cv" id="cover"><div class="eq"><i></i><i></i><i></i></div></div><div class="mi"><b id="song"></b><div class="bar" id="bar"><u id="prog"></u></div><div class="ctl" id="ctl"></div></div></div>
</div>

<script>
/* =====================================================
   ✏️  НАСТРОЙКИ — ЗДЕСЬ МЕНЯЕШЬ ВСЁ В VS CODE
   ===================================================== */
const CONFIG = {
  name: "Eshkaa",
  jpText: "山田リョウ",          // вертикальный текст (можно удалить)
  // 🎵 МУЗЫКА: положи mp3 рядом с index.html. Можно добавить сколько угодно треков.
  playlist: [
    { title: "Улётный День", file: "music3.m4a", cover: "cover2.jpg" },
     { title: "880 Basta", file: "music4.m4a", cover: "cover2.jpg" },
    { title: "Fight Club", file: "music.m4a", cover: "cover.jpg" },
    { title: "Ak-47 and Guf",file: "music2.m4a", cover: "cover2.jpg" },
  { title: "XV лет спустя", file: "music1.m4a", cover: "cover2.jpg" },
    { title: "Улётный День", file: "music3.m4a", cover: "cover2.jpg" },
      { title: "880 Basta", file: "music4.m4a", cover: "cover2.jpg" },

  ],
  volume: 0.5,                    // 0 — тишина, 1 — максимум

  // Картинки: положи файлы в папку images рядом с index.html.
  // Если файла нет — блок просто останется пустым.
  background: "images/bg.jpg",
  // положение персонажа: charTop — где верх головы (0–720), charX — центр по горизонтали
  charTop: 170,
  charX: 690,
  bgRotate: 90,                   // поворот фона: 0, 90, 180 или 270 градусов
  character: "images/character.png", // PNG с прозрачным фоном
  avatar: "images/sitepfp.jpg",
  cards: ["images/card1.jpg", "images/card2.jpg", "images/card3.jpg"],

  // 🔗 ССЫЛКИ СЛЕВА. Чтобы добавить — скопируй строку и поменяй url.
  // icon: tiktok | youtube | facebook | instagram | x | link
  links: [
    { icon: "tiktok",    url: "https://tiktok.com/@eshkacx" },
    { icon: "youtube",   url: "https://youtube.com/@eshkaaedits" },
    { icon: "facebook",  url: "https://facebook.com/your_name" },
    { icon: "instagram", url: "https://instagram.com/eshkacx" },
    { icon: "VK",         url: "https://vk.ru/eshkacx" },
    // { icon: "link",   url: "https://example.com" },
  ],

  // 🔗 ССЫЛКИ СПРАВА (добавляются так же).
  // icon: spotify | telegram | discord | steam | link  (+ все иконки из списка слева)
  rightLinks: [
    { icon: "spotify",  url: "https://open.spotify.com/user/31ci3iridhtspidai5k74dccouwe?si=877606ba2c934c89" },
    { icon: "telegram", url: "https://t.me/eshkacx" },
    { icon: "discord",  url: "https://discord.com/users/eshkaa228" },
    { icon: "steam",    url: "https://steamcommunity.com/id/76561198706569752" },
    // { icon: "link",  url: "https://example.com" },
  ],
};

/* ================= дальше можно не трогать ================= */
const ICONS = {
  tiktok:'<path d="M15 3c.3 2.4 1.8 3.9 4 4.1v3c-1.4 0-2.7-.5-4-1.3V15a5 5 0 1 1-5-5v3a2 2 0 1 0 2 2V3z" fill="currentColor" stroke="none"/>',
  youtube:'<rect x="3" y="6" width="18" height="12" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/>',
  facebook:'<path d="M14 8h2.5V4.5H14C11.8 4.5 10.5 6 10.5 8.2V10.5H8V14h2.5v6H14v-6h2.3l.5-3.5H14V8.5c0-.3.2-.5.5-.5z" fill="currentColor" stroke="none"/>',
  instagram:'<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17" cy="7" r=".6" fill="currentColor"/>',
  x:'<path d="M5 4l14 16M19 4L5 20"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
Object.assign(ICONS, {
  spotify:'<circle cx="12" cy="12" r="9"/><path d="M7 9.5c3.5-1 7-.7 10 1M7.5 12.5c3-.8 6-.5 8.5 1M8 15.3c2.5-.6 5-.4 7 .8"/>',
  telegram:'<path d="M21 4L3 11l6 2.2L11 19l3-3.5 4.5 3.3zM9 13.2L21 4"/>',
  discord:'<path d="M8 6.5c1.2-.5 2.6-.8 4-.8s2.8.3 4 .8c1.700 2.500 2.600 5.200 2.800 8-1.400 1.100-2.800 1.700-4.100 2l-.9-1.600M8 6.500C6.300 9 5.400 11.700 5.200 14.500c1.400 1.100 2.800 1.700 4.100 2l.9-1.600M8.800 14.700c2.100.8 4.300.8 6.400 0"/><circle cx="9.300" cy="11.500" r="1" fill="currentColor"/><circle cx="14.700" cy="11.500" r="1" fill="currentColor"/>',
  steam:'<circle cx="12" cy="12" r="9"/><circle cx="15" cy="9.500" r="2.500"/><path d="M12.700 11.200L7.500 14.500M7.500 14.500a2 2 0 1 0 1.500 2.500"/>'
});
const svg = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
const $ = id => document.getElementById(id);
const LAB = { tiktok:"TikTok", youtube:"YouTube", facebook:"Facebook", instagram:"Instagram", x:"X", spotify:"Spotify", telegram:"Telegram", discord:"Discord", steam:"Steam", link:"Link" };
const tip = l => l.name || LAB[l.icon] || l.icon;   // можно задать свою подпись: { icon:"x", name:"Мой X", url:"..." }

// сайдбар
$("side").innerHTML = `<div class="s">${svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>')}</div>` +
  CONFIG.links.map(l => `<a data-tip="${tip(l)}" href="${l.url}" target="_blank" rel="noopener">${svg(ICONS[l.icon] || ICONS.link)}</a>`).join("");

// правая панель
$("side2").innerHTML = CONFIG.rightLinks.map(l => `<a data-tip="${tip(l)}" href="${l.url}" target="_blank" rel="noopener">${svg(ICONS[l.icon] || ICONS.link)}</a>`).join("");

// тексты и картинки
$("pname").textContent = CONFIG.name;
$("hi").textContent = `Welcome to ${CONFIG.name}'s bio`;
$("jp").textContent = CONFIG.jpText;
document.title = CONFIG.name;
let charBox = null, stageScale = 1;
function positionChar(){
  if (!charBox) return;
  const { w, h, bx, by, bw, bh } = charBox, c = $("char");
  const mobile = matchMedia("(orientation: portrait) and (max-width: 700px)").matches;
  const stageHeight = mobile ? 844 : 720;
  const charTop = mobile ? 220 : CONFIG.charTop;
  const charX = mobile ? 195 : CONFIG.charX;
  const extra = Math.max(0, (innerHeight / stageScale - stageHeight) / 2);
  const k = (stageHeight + extra - charTop) / bh;
  c.style.width = w * k + "px"; c.style.height = h * k + "px";
  c.style.left = (charX - (bx + bw / 2) * k) + "px";
  c.style.top = (charTop - by * k) + "px";
}
const ci = new Image();
ci.onload = () => {
  const w = ci.naturalWidth, h = ci.naturalHeight;
  let box = { w, h, bx: 0, by: 0, bw: w, bh: h };
  try { // обрезаем прозрачные поля, чтобы персонаж встал ровно
    const sc = Math.min(1, 600 / Math.max(w, h)), cv = document.createElement("canvas");
    cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
    const g = cv.getContext("2d"); g.drawImage(ci, 0, 0, cv.width, cv.height);
    const d = g.getImageData(0, 0, cv.width, cv.height).data;
    let x0 = cv.width, y0 = cv.height, x1 = -1, y1 = -1;
    for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++)
      if (d[(y * cv.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 >= 0) box = { w, h, bx: x0 / sc, by: y0 / sc, bw: (x1 - x0 + 1) / sc, bh: (y1 - y0 + 1) / sc };
  } catch (e) {}
  charBox = box; $("char").src = CONFIG.character; positionChar();
};
ci.onerror = () => { $("char").style.display = "none"; };
ci.src = CONFIG.character;
$("pav").src = CONFIG.avatar;
CONFIG.cards.forEach((src, i) => {
  const im = new Image(); im.src = src;
  im.onload = () => $("c" + (i + 1)).appendChild(im);
});
const bg = new Image(); bg.src = CONFIG.background;
bg.onload = () => {
  const r = ((CONFIG.bgRotate % 360) + 360) % 360, sw = r === 90 || r === 270, d = document.createElement("div");
  d.style.cssText = `position:fixed;left:50%;top:50%;width:${sw ? "100vh" : "100vw"};height:${sw ? "100vw" : "100vh"};transform:translate(-50%,-50%) rotate(${r}deg);background:url("${CONFIG.background}") center/cover no-repeat;z-index:-2`;
  document.body.prepend(d);
};

// часы и календарь
function tick(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  $("clock").innerHTML = `${p(d.getHours())}<span class="colon">:</span>${p(d.getMinutes())}`;
  $("date").textContent = `${d.toLocaleDateString("en-US",{weekday:"long"})} ${p(d.getMonth()+1)}/${p(d.getDate())}`;
}
function calendar(){
  const d = new Date(), first = new Date(d.getFullYear(), d.getMonth(), 1).getDay();
  const days = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  let h = `<h3>${d.toLocaleDateString("en-US",{month:"long"})}</h3><div class="g">` +
    "SMTWTFS".split("").map(c => `<span class="h">${c}</span>`).join("") + "<span></span>".repeat(first);
  for (let i = 1; i <= days; i++) h += `<span class="${i === d.getDate() ? "t" : ""}">${i}</span>`;
  $("cal").innerHTML = h + "</div><i></i>";
}
tick(); calendar(); setInterval(tick, 1000);

// ===== музыкальный плеер =====
const P = CONFIG.playlist, audio = new Audio();
let idx = 0, userPaused = false;
audio.volume = CONFIG.volume;
const ic = {
  loop:'<svg class="st" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M5 5h2v14H5zM19 5L9 12l10 7z"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M17 5h2v14h-2zM5 5l10 7-10 7z"/></svg>',
  heart:'<svg class="st" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/></svg>'
};
$("ctl").innerHTML = ["loop","prev","play","next","heart"].map(k => `<button id="b_${k}">${ic[k]}</button>`).join("");
function load(i){
  idx = (i + P.length) % P.length;
  audio.src = P[idx].file;
  $("song").textContent = P[idx].title;
  $("cover").style.backgroundImage = `url("${P[idx].cover}")`;
}
function ui(on){
  $("music").classList.toggle("playing", on);
  $("b_play").innerHTML = on ? ic.pause : ic.play;
}
audio.onerror = () => { ui(false); };
function play(){
  audio.play().then(() => ui(true)).catch(() => ui(false));
}
function toggle(){
  const paused = audio.paused;
  if (paused){ userPaused = false; play(); }
  else { userPaused = true; audio.pause(); ui(false); }
}
load(0); play();
// браузеры блокируют автозапуск — стартуем при первом клике/касании на странице
addEventListener("pointerdown", () => { if (audio.paused && !userPaused) play(); }, { once:true });
$("b_play").onclick = toggle;
$("b_next").onclick = () => { load(idx + 1); userPaused = false; play(); };
$("b_prev").onclick = () => { load(idx - 1); userPaused = false; play(); };
$("b_loop").onclick = e => { audio.loop = !audio.loop; e.currentTarget.classList.toggle("on", audio.loop); };
$("b_heart").onclick = e => e.currentTarget.classList.toggle("on");
audio.ontimeupdate = () => { $("prog").style.width = (audio.currentTime / (audio.duration || 1) * 100) + "%"; };
audio.onended = () => { if (P.length > 1) { load(idx + 1); play(); } else { audio.currentTime = 0; play(); } };
$("bar").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); audio.currentTime = (e.clientX - r.left) / r.width * (audio.duration || 0); };

// движение персонажа за мышкой
addEventListener("pointermove", e => {
  const c = $("char");
  c.style.setProperty("--px", ((e.clientX / innerWidth - .5) * 18) + "px");
  c.style.setProperty("--py", ((e.clientY / innerHeight - .5) * 10) + "px");
});

// атмосфера: плавающие светлые частицы
(function(){
  const c = $("fx"), g = c.getContext("2d"); let W, H; const P = [];
  const rs = () => { W = c.width = innerWidth; H = c.height = innerHeight; }; rs(); addEventListener("resize", rs);
  for (let i = 0; i < 40; i++) P.push({ x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:1+Math.random()*3, s:.2+Math.random()*.5, d:Math.random()*6, a:.25+Math.random()*.4 });
  (function f(t){
    g.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.y -= p.s; p.x += Math.sin(t / 2000 + p.d) * .4;
      if (p.y < -10){ p.y = H + 10; p.x = Math.random() * W; }
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.shadowBlur = 10; g.shadowColor = "#fff"; g.fillStyle = `rgba(255,255,255,${p.a})`; g.fill();
    });
    requestAnimationFrame(f);
  })(0);
})();

// масштаб под любой экран
function fit(){
  const mobile = matchMedia("(orientation: portrait) and (max-width: 700px)").matches;
  const s = mobile
    ? Math.min(innerWidth / 390, innerHeight / 844)
    : Math.min(innerWidth / 1390, innerHeight / 720);
  const st = $("stage");
  stageScale = s; positionChar();
  st.style.transform = `scale(${s}) translate(-50%,-50%)`;
  st.style.transformOrigin = "0 0";
  st.style.left = "50%"; st.style.top = "50%";
}
addEventListener("resize", fit); fit();
</script>
